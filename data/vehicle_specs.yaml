vehicles:

  # Stellantis (fastback/pulse) — conexão TikTok própria, dedicada por nameplate
  # (institucional,fastback / institucional,pulse). Vehicle key separada da
  # `tiktok` genérica para não vazar model_dims/connection id pros outros
  # clientes tiktok (casas_bahia, bradesco, alpargatas).
  tiktok_stellantis:
    vehicle_slug: tiktok
    default_metric: "w:investments---tiktok-mmm"

    # Modela só na granularidade máxima; product_level_2 é derivado por rollup
    # via hierarquia declarada em product_level_3.
    model_dims:
      - product_level_3

    models:
      default_template: "$metric:{metric}$_connection:85714b73-e500-42c2-8c49-3c00306e5171$nameplate:{nameplate}${category}:{value}"

    breakdowns:
      product_level_2:
        category: product-level-2--old-
        values:
          - branding
          - pangle
          - performance

      product_level_3:
        category: product-level-3--old-
        rollups:
          - level: product_level_2
            map: pl3_to_pl2
        values:
          - brand-auction
          - openscreen
          - reach---frequency
          - web-ads---open-loop-e-commerce
          - lead-ads
          - promote--rest-

    hierarchy:
      pl3_to_pl2:
        brand-auction:                  branding
        openscreen:                     branding
        reach---frequency:              branding
        promote--rest-:                 branding
        web-ads---open-loop-e-commerce: performance
        lead-ads:                       performance
