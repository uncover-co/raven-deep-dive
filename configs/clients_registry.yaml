# Registry of clients for batch Deep Dive runs.
#
# Two formats supported:
#
# Multi-vehicle (recommended):
#   client_name:
#     output_subdir: "ClientName"
#     vehicles:
#       vehicle_name:
#         specs_path: "client_vehicle.yaml"
#
# Legacy single-vehicle (backward compat):
#   client_name:
#     specs_path: "client.yaml"
#     output_subdir: "ClientName"
#
# To run all vehicles for a client:   clients=["bradesco"]
# To run one specific vehicle:        clients=["bradesco_tiktok"]

clients:
  bradesco:
    output_subdir: "Bradesco"
    vehicles:
      eletromidia:
        specs_path: "bradesco_eletro.yaml"
      tiktok:
        specs_path: "bradesco_tiktok.yaml"

  casas_bahia:
    output_subdir: "Casas_Bahia"
    vehicles:
      tiktok:
        specs_path: "casas_bahia_tiktok.yaml"

  alpargatas:
    output_subdir: "Alpargatas"
    vehicles:
      tiktok:
        specs_path: "alpargatas_tiktok.yaml"

  hypera:
    output_subdir: "Hypera"
    vehicles:
      eletromidia:
        specs_path: "hypera_eletro.yaml"  # TODO: fill media_var e workspace_dd

  opella:
    output_subdir: "Opella"
    vehicles:
      eletromidia:
        specs_path: "opella_eletro.yaml"  # TODO: fill media_var e workspace_dd
